<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BookManager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Header limpio (sin ola) -->
  <header class="header">
    <div class="container header-content">
      <div class="logo">
       
        <h1>BookManager 📚​</h1>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <div class="left">
        <button id="btnAdd" class="btn primary">+ Nuevo libro 📕​</button>
      </div>
      <div class="right">
        <input id="searchInput" type="search" placeholder="Buscar por título, autor o ISBN… ​🔎​" />
      </div>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Título</th>
            <th>Autor/a</th>
            <th>Año</th>
            <th>Género</th>
            <th>ISBN</th>
            <th class="col-actions">Acciones</th>
          </tr>
        </thead>
        <tbody id="booksTbody">
          <!-- Filas generadas por JS -->
        </tbody>
      </table>

      <div id="emptyState" class="empty hidden">
        <p>No hay libros cargados. ¡Agregá el primero! 😊</p>
      </div>
    </section>
  </main>

  <!-- Modal Crear/Editar -->
  <dialog id="bookModal" class="modal">
    <form id="bookForm" method="dialog" class="modal-card" novalidate>
      <div class="modal-header">
        <h2 id="modalTitle">Nuevo libro 📕</h2>
        <button type="button" class="icon-btn" data-action="close" aria-label="Cerrar">✕</button>
      </div>

      <div class="grid">
        <div class="field">
          <label for="title">Título *</label>
          <input id="title" name="title" type="text" required maxlength="120" />
          <small class="error" data-for="title"></small>
        </div>

        <div class="field">
          <label for="author">Autor/a *</label>
          <input id="author" name="author" type="text" required maxlength="120" />
          <small class="error" data-for="author"></small>
        </div>

        <div class="field">
          <label for="year">Año *</label>
          <input id="year" name="year" type="number" required min="1000" max="2100" />
          <small class="error" data-for="year"></small>
        </div>

        <div class="field">
          <label for="genre">Género *</label>
          <input id="genre" name="genre" type="text" required maxlength="60" />
          <small class="error" data-for="genre"></small>
        </div>

        <div class="field">
          <label for="isbn">ISBN *</label>
          <input id="isbn" name="isbn" type="text" required maxlength="20" />
          <small class="error" data-for="isbn"></small>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn" data-action="close">Cancelar</button>
        <button type="submit" class="btn primary" id="saveBtn">Guardar</button>
      </div>

      <input type="hidden" id="bookId" name="id" />
    </form>
  </dialog>

  <!-- Modal Confirmación -->
  <dialog id="confirmModal" class="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Confirmar borrado</h2>
      </div>
      <div class="confirm-body">
        <p id="confirmMessage">¿Seguro que querés borrar este libro?</p>
      </div>
      <div class="modal-footer">
        <button class="btn" data-action="cancel">Cancelar</button>
        <button class="btn danger" data-action="confirm">Borrar</button>
      </div>
    </div>
  </dialog>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2025 BookManager — Desarrollado por <strong>María Luz Britos</strong></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
